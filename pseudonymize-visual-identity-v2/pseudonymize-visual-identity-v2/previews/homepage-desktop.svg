<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020">
<rect width="1440" height="1020" fill="#081016"/>
<defs><style>.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:monospace}.muted{fill:#A6B5BD}.dim{fill:#758690}.green{fill:#48D6B0}.white{fill:#EEF5F7}</style></defs>
<!-- nav --><line x1="0" y1="74" x2="1440" y2="74" stroke="#1A2932"/><rect x="130" y="21" width="32" height="32" rx="8" fill="#0D171F"/><text x="140" y="44" class="sans white" font-size="20" font-weight="650">p</text><line x1="153" y1="18" x2="137" y2="56" stroke="#48D6B0" stroke-width="4" stroke-linecap="round"/><text x="174" y="44" class="sans white" font-size="18" font-weight="650">pseudonymize</text><text x="286" y="44" class="mono green" font-size="12">.io</text><text x="745" y="44" class="sans muted" font-size="13">Product</text><text x="820" y="44" class="sans muted" font-size="13">Developers</text><text x="920" y="44" class="sans muted" font-size="13">Security</text><text x="1000" y="44" class="sans muted" font-size="13">Docs</text><rect x="1100" y="20" width="100" height="34" rx="7" fill="none" stroke="#263843"/><text x="1123" y="42" class="sans white" font-size="12" font-weight="600">Docs</text><rect x="1210" y="20" width="114" height="34" rx="7" fill="#48D6B0"/><text x="1231" y="42" class="sans" fill="#081016" font-size="12" font-weight="650">Pseudonymize</text>
<!-- hero --><text x="130" y="160" class="mono green" font-size="11" letter-spacing="1.6">PRIVACY-PRESERVING DATA INFRASTRUCTURE</text><text x="130" y="246" class="sans white" font-size="70" font-weight="650" letter-spacing="-3.7">Keep the structure.</text><text x="130" y="321" class="sans muted" font-size="70" font-weight="650" letter-spacing="-3.7">Lose the identity.</text><text x="130" y="378" class="sans muted" font-size="17">Detect and replace sensitive identifiers across text, datasets and files</text><text x="130" y="405" class="sans muted" font-size="17">with consistent pseudonyms, while keeping the data useful.</text><rect x="130" y="447" width="148" height="42" rx="8" fill="#48D6B0"/><text x="153" y="473" class="sans" fill="#081016" font-size="13" font-weight="650">Pseudonymize data</text><rect x="290" y="447" width="151" height="42" rx="8" fill="none" stroke="#263843"/><text x="312" y="473" class="sans white" font-size="13" font-weight="600">View docs ↗</text><circle cx="135" cy="524" r="4" fill="#48D6B0"/><text x="147" y="529" class="sans dim" font-size="11">Deterministic tokens</text><circle cx="273" cy="524" r="4" fill="#48D6B0"/><text x="285" y="529" class="sans dim" font-size="11">Text, tables &amp; files</text><circle cx="418" cy="524" r="4" fill="#48D6B0"/><text x="430" y="529" class="sans dim" font-size="11">API-first</text>
<!-- processor --><rect x="760" y="132" width="550" height="420" rx="16" fill="#0D171F" stroke="#263843"/><line x1="760" y1="181" x2="1310" y2="181" stroke="#263843"/><text x="780" y="162" class="mono dim" font-size="10">example/customer-note.txt</text><circle cx="1198" cy="157" r="4" fill="#48D6B0"/><text x="1210" y="162" class="sans muted" font-size="10">Pseudonymized</text><line x1="1035" y1="181" x2="1035" y2="552" stroke="#263843"/><text x="782" y="215" class="mono dim" font-size="9" letter-spacing="1.5">ORIGINAL</text><text x="1058" y="215" class="mono dim" font-size="9" letter-spacing="1.5">PSEUDONYMIZED</text>
<g class="mono" font-size="12"><text x="782" y="259" fill="#DCE5E8">Customer: Alice Morgan</text><text x="782" y="310" fill="#DCE5E8">Email: alice@example.com</text><text x="782" y="361" fill="#DCE5E8">Phone: +49 151 555 0192</text><text x="782" y="412" fill="#DCE5E8">Office: Munich</text><text x="1058" y="259" fill="#48D6B0">Customer: PERSON_7F2A</text><text x="1058" y="310" fill="#48D6B0">Email: EMAIL_1C9D</text><text x="1058" y="361" fill="#48D6B0">Phone: PHONE_88B1</text><text x="1058" y="412" fill="#48D6B0">Office: CITY_03E4</text></g><g stroke="#1C2B34"><line x1="780" y1="274" x2="1013" y2="274"/><line x1="780" y1="325" x2="1013" y2="325"/><line x1="780" y1="376" x2="1013" y2="376"/><line x1="1057" y1="274" x2="1286" y2="274"/><line x1="1057" y1="325" x2="1286" y2="325"/><line x1="1057" y1="376" x2="1286" y2="376"/></g><text x="782" y="474" class="mono dim" font-size="10">4 entities detected</text><text x="1058" y="474" class="mono green" font-size="10">context preserved · identity detached</text>
<!-- trust strip --><line x1="0" y1="592" x2="1440" y2="592" stroke="#16252E"/><line x1="0" y1="652" x2="1440" y2="652" stroke="#16252E"/><text x="130" y="627" class="sans dim" font-size="11">Trust is documented, not decorated.</text><text x="650" y="627" class="sans muted" font-size="11">[Deployment model]</text><text x="811" y="627" class="sans dim" font-size="11">verify before publish</text><text x="960" y="627" class="sans muted" font-size="11">[Retention policy]</text><text x="1101" y="627" class="sans dim" font-size="11">verify before publish</text>
<!-- lower --><text x="130" y="727" class="mono green" font-size="10" letter-spacing="1.5">ONE PRIVACY LAYER</text><text x="130" y="775" class="sans white" font-size="39" font-weight="620" letter-spacing="-1.7">Different data in. One consistent transformation.</text><text x="130" y="812" class="sans muted" font-size="14">The product makes pseudonymization visible, reviewable and boring in the best possible way.</text>
<g><rect x="130" y="858" width="365" height="128" rx="13" fill="#0B151C" stroke="#263843"/><text x="151" y="884" class="mono green" font-size="9">01 / TEXT</text><text x="151" y="920" class="sans white" font-size="17" font-weight="600">Free-form text</text><text x="151" y="948" class="sans dim" font-size="11">Names, emails, phones, locations.</text><text x="151" y="972" class="mono green" font-size="10">Alice → PERSON_7F2A</text><rect x="513" y="858" width="365" height="128" rx="13" fill="#0B151C" stroke="#263843"/><text x="534" y="884" class="mono green" font-size="9">02 / TABLES</text><text x="534" y="920" class="sans white" font-size="17" font-weight="600">Structured data</text><text x="534" y="948" class="sans dim" font-size="11">Keep record relationships intact.</text><text x="534" y="972" class="mono green" font-size="10">customer_id → CUST_91C4</text><rect x="896" y="858" width="365" height="128" rx="13" fill="#0B151C" stroke="#263843"/><text x="917" y="884" class="mono green" font-size="9">03 / FILES</text><text x="917" y="920" class="sans white" font-size="17" font-weight="600">Working files</text><text x="917" y="948" class="sans dim" font-size="11">One policy layer across formats.</text><text x="917" y="972" class="mono green" font-size="10">report.pdf → safe/report.pdf</text></g>
</svg>