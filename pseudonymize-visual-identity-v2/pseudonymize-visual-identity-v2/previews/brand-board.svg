<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#EEF3F5"/><defs><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:monospace}</style></defs><rect x="70" y="70" width="1300" height="300" rx="24" fill="#081016"/><text x="125" y="128" class="m" fill="#48D6B0" font-size="11" letter-spacing="2">PSEUDONYMIZE.IO</text><text x="125" y="215" class="s" fill="#EEF5F7" font-size="61" font-weight="650" letter-spacing="-3">Keep the structure.</text><text x="125" y="286" class="s" fill="#A6B5BD" font-size="61" font-weight="650" letter-spacing="-3">Lose the identity.</text><text x="1040" y="257" class="s" fill="#A6B5BD" font-size="15">Privacy infrastructure</text><text x="1040" y="280" class="s" fill="#A6B5BD" font-size="15">without security theatre.</text><rect x="70" y="390" width="640" height="240" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><text x="105" y="430" class="m" fill="#758690" font-size="10">TYPOGRAPHY</text><text x="105" y="492" class="s" fill="#111B21" font-size="42" font-weight="650" letter-spacing="-1.8">Precise, calm,</text><text x="105" y="540" class="s" fill="#111B21" font-size="42" font-weight="650" letter-spacing="-1.8">infrastructure-grade.</text><text x="105" y="588" class="m" fill="#0C8D70" font-size="14">PERSON_7F2A · EMAIL_1C9D</text><rect x="730" y="390" width="640" height="240" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><text x="765" y="430" class="m" fill="#758690" font-size="10">COLOR SYSTEM</text><g><rect x="765" y="473" width="72" height="72" rx="12" fill="#081016"/><rect x="850" y="473" width="72" height="72" rx="12" fill="#121F29"/><rect x="935" y="473" width="72" height="72" rx="12" fill="#263843"/><rect x="1020" y="473" width="72" height="72" rx="12" fill="#48D6B0"/><rect x="1105" y="473" width="72" height="72" rx="12" fill="#EEF5F7" stroke="#D7E1E5"/></g><text x="765" y="586" class="s" fill="#758690" font-size="12">Cipher Green is reserved for transformed output and focused actions.</text><rect x="70" y="650" width="640" height="280" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><text x="105" y="690" class="m" fill="#758690" font-size="10">SIGNATURE GRAMMAR</text><g class="m" font-size="14"><rect x="105" y="723" width="570" height="48" rx="9" fill="#081016"/><text x="125" y="753" fill="#A6B5BD">Alice Morgan → <tspan fill="#48D6B0">PERSON_7F2A</tspan></text><rect x="105" y="786" width="570" height="48" rx="9" fill="#081016"/><text x="125" y="816" fill="#A6B5BD">Munich → <tspan fill="#48D6B0">CITY_03E4</tspan></text><rect x="105" y="849" width="570" height="48" rx="9" fill="#081016"/><text x="125" y="879" fill="#A6B5BD">alice@example.com → <tspan fill="#48D6B0">EMAIL_1C9D</tspan></text></g><rect x="730" y="650" width="640" height="280" rx="18" fill="#FFFFFF" stroke="#D7E1E5"/><text x="765" y="690" class="m" fill="#758690" font-size="10">DESIGN PRINCIPLE</text><text x="765" y="750" class="s" fill="#111B21" font-size="30" font-weight="500" letter-spacing="-1">Security through precision,</text><text x="765" y="790" class="s" fill="#111B21" font-size="30" font-weight="500" letter-spacing="-1">inspectability and restraint.</text><text x="765" y="846" class="s" fill="#758690" font-size="14">Not shields, gradients or claims nobody can prove.</text></svg>