<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect width="390" height="844" fill="#081016"/><defs><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:monospace}</style></defs><line x1="0" y1="62" x2="390" y2="62" stroke="#1A2932"/><text x="18" y="38" class="s" fill="#EEF5F7" font-size="15" font-weight="650">pseudonymize</text><text x="118" y="38" class="m" fill="#48D6B0" font-size="9">.io</text><rect x="277" y="15" width="94" height="32" rx="7" fill="#48D6B0"/><text x="294" y="35" class="s" fill="#081016" font-size="10" font-weight="650">Pseudonymize</text><text x="18" y="116" class="m" fill="#48D6B0" font-size="8" letter-spacing="1.2">PRIVACY-PRESERVING DATA</text><text x="18" y="172" class="s" fill="#EEF5F7" font-size="43" font-weight="650" letter-spacing="-2">Keep the</text><text x="18" y="219" class="s" fill="#EEF5F7" font-size="43" font-weight="650" letter-spacing="-2">structure.</text><text x="18" y="266" class="s" fill="#A6B5BD" font-size="43" font-weight="650" letter-spacing="-2">Lose the</text><text x="18" y="313" class="s" fill="#A6B5BD" font-size="43" font-weight="650" letter-spacing="-2">identity.</text><text x="18" y="353" class="s" fill="#A6B5BD" font-size="13">Pseudonymize sensitive text, datasets</text><text x="18" y="375" class="s" fill="#A6B5BD" font-size="13">and files without destroying their use.</text><rect x="18" y="405" width="135" height="40" rx="8" fill="#48D6B0"/><text x="37" y="430" class="s" fill="#081016" font-size="11" font-weight="650">Pseudonymize data</text><rect x="18" y="486" width="354" height="316" rx="14" fill="#0D171F" stroke="#263843"/><line x1="18" y1="529" x2="372" y2="529" stroke="#263843"/><text x="35" y="513" class="m" fill="#758690" font-size="8">example/customer-note.txt</text><circle cx="306" cy="508" r="3" fill="#48D6B0"/><text x="316" y="512" class="s" fill="#A6B5BD" font-size="8">Pseudonymized</text><text x="35" y="558" class="m" fill="#758690" font-size="8" letter-spacing="1.2">ORIGINAL</text><text x="35" y="589" class="m" fill="#DCE5E8" font-size="10">Alice Morgan</text><text x="35" y="617" class="m" fill="#DCE5E8" font-size="10">alice@example.com</text><text x="35" y="645" class="m" fill="#DCE5E8" font-size="10">Munich</text><line x1="35" y1="667" x2="355" y2="667" stroke="#263843"/><text x="35" y="695" class="m" fill="#758690" font-size="8" letter-spacing="1.2">PSEUDONYMIZED</text><text x="35" y="726" class="m" fill="#48D6B0" font-size="10">PERSON_7F2A</text><text x="35" y="754" class="m" fill="#48D6B0" font-size="10">EMAIL_1C9D</text><text x="35" y="782" class="m" fill="#48D6B0" font-size="10">CITY_03E4</text><text x="18" y="829" class="s" fill="#758690" font-size="9">context preserved · identity detached</text></svg>