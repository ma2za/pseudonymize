<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F7F9FA"/><defs><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:monospace}.t{fill:#111B21}.u{fill:#5E6D75}.g{fill:#0C8D70}</style></defs><rect width="1440" height="64" fill="#FFFFFF"/><line x1="0" y1="64" x2="1440" y2="64" stroke="#D7E1E5"/><text x="120" y="39" class="s t" font-weight="650" font-size="16">pseudonymize</text><text x="231" y="39" class="m g" font-size="10">.io</text><text x="260" y="39" class="s u" font-size="13">/ docs</text><text x="1160" y="39" class="s u" font-size="11">Search documentation ⌘K</text><g class="s u" font-size="12"><text x="122" y="120" class="t" font-weight="650">Get started</text><text x="122" y="150" class="t">Introduction</text><text x="122" y="179">Quickstart</text><text x="122" y="208">Concepts</text><text x="122" y="257" class="t" font-weight="650">Pseudonymize</text><text x="122" y="286">Text</text><text x="122" y="315">Tables</text><text x="122" y="344">Files</text><text x="122" y="373">Policies</text><text x="122" y="422" class="t" font-weight="650">API</text><text x="122" y="451">Authentication</text><text x="122" y="480">Errors</text><text x="122" y="509">Webhooks</text></g><text x="360" y="119" class="m g" font-size="10" letter-spacing="1.4">GET STARTED</text><text x="360" y="171" class="s t" font-size="42" font-weight="650" letter-spacing="-1.8">Pseudonymize text</text><text x="360" y="210" class="s u" font-size="14">Send text to the API and receive content with configured sensitive entities</text><text x="360" y="233" class="s u" font-size="14">replaced by stable pseudonyms.</text><text x="360" y="294" class="s t" font-size="23" font-weight="650">Request</text><text x="360" y="326" class="s u" font-size="13">Create a request with the text and policy you want to apply.</text><rect x="360" y="352" width="720" height="185" rx="10" fill="#081016"/><g class="m" font-size="12"><text x="382" y="390" fill="#C59EFF">curl <tspan fill="#BDCBD1">https://api.pseudonymize.io/v1/text \</tspan></text><text x="382" y="420" fill="#78AFFF">  -H "Authorization: Bearer $PZ_API_KEY" \</text><text x="382" y="450" fill="#78AFFF">  -d '{ "text": <tspan fill="#48D6B0">"Alice lives in Munich"</tspan> }'</text></g><text x="360" y="598" class="s t" font-size="23" font-weight="650">Response</text><text x="360" y="630" class="s u" font-size="13">Structure is preserved while detected values are replaced.</text><rect x="360" y="656" width="720" height="170" rx="10" fill="#081016"/><g class="m" font-size="12"><text x="382" y="694" fill="#BDCBD1">{</text><text x="398" y="723" fill="#78AFFF">"text": <tspan fill="#48D6B0">"PERSON_7F2A lives in CITY_03E4"</tspan>,</text><text x="398" y="752" fill="#78AFFF">"entities": <tspan fill="#BDCBD1">2</tspan></text><text x="382" y="781" fill="#BDCBD1">}</text></g><text x="1160" y="120" class="s t" font-size="11" font-weight="650">On this page</text><text x="1160" y="150" class="s u" font-size="11">Request</text><text x="1160" y="178" class="s u" font-size="11">Response</text><text x="1160" y="206" class="s u" font-size="11">Design principle</text></svg>