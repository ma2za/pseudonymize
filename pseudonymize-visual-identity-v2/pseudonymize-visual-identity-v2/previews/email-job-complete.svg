<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800"><rect width="900" height="800" fill="#EEF3F5"/><defs><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:monospace}</style></defs><text x="140" y="88" class="s" fill="#111B21" font-size="18" font-weight="650">pseudonymize</text><text x="255" y="88" class="m" fill="#0C8D70" font-size="10">.io</text><rect x="140" y="115" width="620" height="535" rx="13" fill="#FFFFFF" stroke="#D7E1E5"/><text x="180" y="166" class="m" fill="#0C8D70" font-size="10" letter-spacing="1.5">JOB COMPLETE</text><text x="180" y="219" class="s" fill="#111B21" font-size="29" font-weight="650" letter-spacing="-1.1">Your file is pseudonymized.</text><text x="180" y="263" class="s" fill="#5E6D75" font-size="13">customer-export.csv finished processing. Review the detected</text><text x="180" y="286" class="s" fill="#5E6D75" font-size="13">entity summary before exporting the transformed file.</text><rect x="180" y="320" width="540" height="137" rx="9" fill="#F9FBFB" stroke="#D7E1E5"/><g class="m" font-size="12"><text x="201" y="352" fill="#5E6D75">PERSON <tspan fill="#0C8D70">124</tspan></text><text x="201" y="382" fill="#5E6D75">EMAIL <tspan fill="#0C8D70">103</tspan></text><text x="201" y="412" fill="#5E6D75">PHONE <tspan fill="#0C8D70">61</tspan></text><text x="201" y="442" fill="#5E6D75">LOCATION <tspan fill="#0C8D70">18</tspan></text></g><rect x="180" y="486" width="117" height="40" rx="7" fill="#111B21"/><text x="199" y="511" class="s" fill="#FFFFFF" font-size="12" font-weight="650">Review output</text><text x="180" y="571" class="s" fill="#758690" font-size="11">Security-sensitive notifications state what changed, when, scope and action.</text><text x="180" y="592" class="s" fill="#758690" font-size="11">No decorative theatre required.</text><text x="142" y="686" class="s" fill="#758690" font-size="10">pseudonymize.io · transactional email system</text></svg>