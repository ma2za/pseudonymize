[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pseudonymize"
version = "0.6.1"
description = "Local-first PII pseudonymization for text, structured data, and LLM payloads."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ma2za" }]
keywords = ["pii", "pseudonymization", "redaction", "privacy", "gdpr", "llm", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ma2za/pseudonymize"
Documentation = "https://ma2za.github.io/pseudonymize/"
Repository = "https://github.com/ma2za/pseudonymize"
Issues = "https://github.com/ma2za/pseudonymize/issues"
Changelog = "https://github.com/ma2za/pseudonymize/blob/main/CHANGELOG.md"
Security = "https://github.com/ma2za/pseudonymize/security/policy"

[project.scripts]
pseudonymize = "pseudonymize.cli:main"

[project.optional-dependencies]
ml = [
    "huggingface-hub>=1.28.0",
    "onnxruntime>=1.29.0",
    "tokenizers>=0.23.1",
]
office = [
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]
pdf = [
    "pdfminer.six>=20240706",
    "pymupdf>=1.24.0",
]
ocr = [
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
]
remote = [
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pseudonymize"]

[dependency-groups]
test = [
    "hypothesis>=6",
    "pytest>=8",
    "pytest-benchmark>=5",
    "pytest-cov>=5",
    "fpdf2>=2.7.9",
    "respx>=0.23.1",
]
quality = ["mypy>=1.11", "pre-commit>=4", "ruff>=0.9"]
docs = ["mkdocs-material>=9", "mkdocstrings[python]>=1.0.6"]
release = ["build>=1", "twine>=6"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "SIM", "PERF", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "onnxruntime.*",
    "tokenizers.*",
    "pdfminer.*",
    "pymupdf.*",
    "pytesseract.*",
    "docx.*",
    "pptx.*",
    "openpyxl.*",
    "httpx.*",
    "respx.*"
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "benchmark_*.py"]
addopts = ["--strict-config", "--strict-markers", "-ra", "--cov=pseudonymize", "--cov-report=term-missing", "--cov-branch", "--cov-fail-under=95.36", "--basetemp=.pytest_temp"]
markers = ["benchmark: performance benchmark", "integration: integration test", "slow: deliberately slow test"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["pseudonymize"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "class .*\\bProtocol\\):",
  "if __name__ == .__main__.:",
]

[tool.pytest-benchmark]
disable_gc = true
warmup = true
