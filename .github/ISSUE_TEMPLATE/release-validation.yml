name: Release-candidate validation
description: Report a synthetic installation or integration result for 0.1.0rc1
title: "validation: 0.1.0rc1 "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Never include real personal data, credentials, private files, or production payloads.
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Installation command
    validations:
      required: true
  - type: input
    id: digest
    attributes:
      label: Wheel SHA-256 digest
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow exercised
      description: Describe the API, CLI, or file workflow using synthetic data only.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - Passed
        - Failed
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Sanitized details
      description: Remove matched values, paths, usernames, keys, tokens, and private host details.
