name: Performance Benchmarks

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  UV_FROZEN: "1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: uv sync --all-extras --frozen --group test

      - name: Run benchmarks
        run: uv run pytest benchmarks/ --benchmark-json benchmark-output.json

      - name: Store and compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Python Benchmark with pytest-benchmark
          tool: 'pytest'
          output-file-path: benchmark-output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Fail the job if performance degrades by more than 20%
          fail-on-alert: true
          alert-threshold: '120%'
          # Leave a comment on PRs if performance degrades
          comment-on-alert: true
          summary-always: true

