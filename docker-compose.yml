version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pseudonymize_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pseudonymize
    ports:
      - "5432:5432"
    volumes:
      - pseudonymize_pgdata:/var/lib/postgresql/data

volumes:
  pseudonymize_pgdata: